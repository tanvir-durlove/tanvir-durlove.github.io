<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Join a group on Nudgy — NextGen Tool</title>
  <meta name="description" content="Open this group invite in the Nudgy app, or get Nudgy from Google Play.">
  <link rel="icon" type="image/svg+xml" href="/logo.svg">
  <link rel="stylesheet" href="/assets/css/main.css">
</head>
<body class="accent-coral">
  <header class="site-header">
    <div class="bar">
      <a class="brand" href="/"><img src="/logo.svg" alt="NextGen Tool logo">NextGen Tool</a>
      <nav>
        <a href="/">All Apps</a>
        <a href="/nudgy/">Nudgy</a>
      </nav>
    </div>
  </header>
  <div class="join">
    <h1>Join a group on Nudgy</h1>
    <p>This link opens the group in the Nudgy app. If you don't have the app yet, get it from Google Play and then open the link again.</p>
    <p class="code" id="codeBox">Invite code: <strong id="codeText"></strong></p>
    <a class="btn" href="https://play.google.com/store/apps/details?id=com.nextgentool.nudgy">Get Nudgy</a>
    <p class="note">Nudgy is a calm daily planner for Android by NextGen Tool.</p>
  </div>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var code = params.get('code');
      if (code) {
        document.getElementById('codeText').textContent = code;
        document.getElementById('codeBox').style.display = 'block';
      }
    })();
  </script>
  <script src="/assets/js/main.js"></script>
</body>
</html>
